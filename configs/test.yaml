programs:
  nginx:
    cmd: "/usr/sbin/nginx -c /etc/nginx/test.conf"
    numprocs: 1
    umask: "022"
    workingdir: /tmp
    autostart: true
    autorestart: "unexpected"
    exitcodes:
      - 0
      - 2
    startretries: 3
    starttime: 5
    stopsignal: TERM
    stoptime: 10
    stdout: /home/user/Desktop/taskmaster/nginx.stdout
    stderr: /home/user/Desktop/taskmaster/nginx.stderr
  vogsphere:
    cmd: "/usr/local/bin/vogsphere-worker --no-prefork"
    numprocs: 8
    umask: "077"
    workingdir: /tmp
    autostart: true
    autorestart: "unexpected"
    exitcodes:
      - 0
    startretries: 3
    starttime: 5
    stopsignal: TERM
    stoptime: 10
    stdout: /home/user/Desktop/taskmaster/nginx.stdout
    stderr: /home/user/Desktop/taskmaster/nginx.stderr